name: Release-Build

on:
  push:
    tags:
      - "v*.*.*"
  # a manual run builds all packages and attaches them to the run, without a release
  workflow_dispatch:
    inputs:
      flatpak:
        description: "build the flatpak package (slow)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    # pinned: the runner image decides the oldest glibc that can run the AppImage, and
    # ubuntu-latest moves to a newer Ubuntu without notice
    runs-on: ubuntu-24.04
    outputs:
      version_number: ${{ steps.version_number.outputs.version_number }}
      deb_package_filename: ${{ steps.create_deb_package.outputs.deb_package_filename }}
      appimage_filenname: ${{ steps.create_appimage.outputs.appimage_filename }}
      flatpak_package_filename: ${{ steps.create_flatpak_package.outputs.flatpak_package_filename }}
    steps:
      - name: Install Linux packages and build tools
        run: sudo add-apt-repository universe && sudo apt update && sudo apt install -y --no-install-recommends libfuse2t64 libxcb-cursor0 qt6-gtk-platformtheme qt6-base-dev libqscintilla2-qt6-dev qt6-base-private-dev qt6-charts-dev qt6-multimedia-dev qt6-pdf-dev qt6-positioning-dev qt6-svg-dev qt6-tools-dev qt6-webchannel-dev qt6-webengine-dev qt6-declarative-dev qml6-module-qtquick-{controls,shapes,layouts,templates,window} build-essential

      - name: Check out code into the Go module directory
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # the tools come from github releases, the cache keeps a flaky download out of the
      # build steps
      - name: Cache the AppImage build tools
        uses: actions/cache@v4
        with:
          path: .appimage-build/tools
          key: appimage-tools-${{ hashFiles('Makefile') }}

      - name: Download the AppImage build tools
        run: make appimage_tools

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.0"
        id: go

      - name: Version Number
        id: version_number
        run: echo "version_number=$(make version_number)" >> $GITHUB_OUTPUT

      - name: Show Version
        run: echo "Version ${{ steps.version_number.outputs.version_number }}"

      - name: Build
        run: make deps test build

      - name: Create AppImage
        id: create_appimage
        run: |
          make appimage
          echo "appimage_filename=$(ls ./hellocontest*.AppImage | head -n 1)" >> $GITHUB_OUTPUT

      - name: Create Debian package
        id: create_deb_package
        run: |
          make debpkg
          echo "deb_package_filename=$(ls ./hellocontest*.deb | head -n 1)" >> $GITHUB_OUTPUT

      - name: Install Flatpak build tools
        if: github.event_name != 'workflow_dispatch' || inputs.flatpak
        run: |
          sudo apt install -y --no-install-recommends flatpak flatpak-builder
          # flatpak-builder needs unprivileged user namespaces, Ubuntu restricts them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # the stage cache of flatpak-builder, the build directory itself is transient and
      # would only make the cache big
      - name: Cache the Flatpak build stages
        if: github.event_name != 'workflow_dispatch' || inputs.flatpak
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder/cache
            .flatpak-builder/checksums
            .flatpak-builder/ccache
          key: flatpak-builder-${{ github.sha }}
          restore-keys: flatpak-builder-

      - name: Create Flatpak package
        id: create_flatpak_package
        if: github.event_name != 'workflow_dispatch' || inputs.flatpak
        run: |
          make flatpak_deps flatpak
          echo "flatpak_package_filename=$(ls ./hellocontest*.flatpak | head -n 1)" >> $GITHUB_OUTPUT

      # the appstream compose of flatpak-builder fails only on the runner, the report names
      # the file that it cannot read
      - name: Show the AppStream report
        if: always() && steps.create_flatpak_package.conclusion == 'failure'
        run: |
          appstreamcli --version
          find .flatpak-build/build/files/share/metainfo \
               .flatpak-build/build/files/share/applications \
               .flatpak-build/build/files/share/icons -type f -o -type l | xargs ls -la
          appstreamcli compose --prefix=/ --origin=com.thecodingflow.hellocontest \
            --components=com.thecodingflow.hellocontest --print-report=full \
            --result-root=/tmp/as --data-dir=/tmp/as/xmls --icons-dir=/tmp/as/icons \
            .flatpak-build/build/files

      - name: "Upload binary for linux_x86_64"
        uses: actions/upload-artifact@v4
        with:
          name: hellocontest-binary
          path: ./hellocontest

      - name: "Upload AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: hellocontest-appimage
          path: |
            ${{ steps.create_appimage.outputs.appimage_filename }}
            ${{ steps.create_appimage.outputs.appimage_filename }}.zsync

      - name: "Upload Debian package"
        uses: actions/upload-artifact@v4
        with:
          name: hellocontest-debpkg
          path: ${{ steps.create_deb_package.outputs.deb_package_filename }}

      - name: "Upload Flatpak package"
        if: github.event_name != 'workflow_dispatch' || inputs.flatpak
        uses: actions/upload-artifact@v4
        with:
          name: hellocontest-flatpak
          path: ${{ steps.create_flatpak_package.outputs.flatpak_package_filename }}

      - name: Upload package to the release
        # only a pushed tag makes a release, a manual run keeps the packages as run
        # artifacts, even when it is started on a tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./hellocontest*.{deb,AppImage,AppImage.zsync,flatpak}
          tag: ${{ github.ref }}
